<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Health Reporting · Fortunebolt Pharma HR</title>
<link rel="stylesheet" href="../../assets/css/tokens.css" />
<link rel="stylesheet" href="../../assets/css/shell.css" />
</head>
<body>
<script>window.FB_BASE = '../../'; window.FB_PAGE = 'health/reporting';</script>
<div id="fb-page-root">
  <div class="fb-breadcrumb">Health &amp; Wellness (Clinic)</div>
  <div class="fb-page-head">
    <div>
      <h1>Health Reporting</h1>
      <p class="fb-page-desc">Reports defined against any parameter across medical history, bills, vaccinations and sick leave — each exports a real CSV.</p>
    </div>
  </div>

  <div class="fb-grid fb-grid--2">
    <div class="fb-card">
      <div class="fb-card__head"><span class="fb-card__title">Medical bills by status</span><button class="fb-btn fb-btn--sm" data-export="bills">Export CSV</button></div>
      <div id="rp-bills"></div>
    </div>
    <div class="fb-card">
      <div class="fb-card__head"><span class="fb-card__title">Vaccination compliance</span><button class="fb-btn fb-btn--sm" data-export="vax">Export CSV</button></div>
      <div id="rp-vax"></div>
    </div>
    <div class="fb-card">
      <div class="fb-card__head"><span class="fb-card__title">Sick leave by reason</span><button class="fb-btn fb-btn--sm" data-export="sick">Export CSV</button></div>
      <div id="rp-sick"></div>
    </div>
    <div class="fb-card">
      <div class="fb-card__head"><span class="fb-card__title">Medical incident log</span><button class="fb-btn fb-btn--sm" data-export="incidents">Export CSV</button></div>
      <div id="rp-incidents"></div>
    </div>
  </div>
</div>

<script src="../../assets/js/db.seed.js"></script>
<script src="../../assets/js/events.js"></script>
<script src="../../assets/js/store.js"></script>
<script src="../../assets/js/components.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/shell.js"></script>
<script src="../../assets/js/pages/health-reporting.js"></script>
</body>
</html>
