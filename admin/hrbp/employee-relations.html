<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Employee Relations & ESS · Fortunebolt Pharma HR</title>
<link rel="stylesheet" href="../../assets/css/tokens.css" />
<link rel="stylesheet" href="../../assets/css/shell.css" />
</head>
<body>
<script>window.FB_BASE = '../../'; window.FB_PAGE = 'hrbp/employee-relations';</script>
<div id="fb-page-root">
  <div class="fb-breadcrumb">HR Business Partnering</div>
  <div class="fb-page-head">
    <div>
      <h1>Employee Relations &amp; Self-Service</h1>
      <p class="fb-page-desc">Admin view of the ESS portal: leave, profile/document change requests, life-event notifications, staff welfare requests, and employee opinion surveys.</p>
    </div>
    <div class="fb-page-actions">
      <button class="fb-btn" id="fb-btn-new-survey">+ Deploy survey</button>
      <button class="fb-btn fb-btn--primary" id="fb-btn-new-welfare">+ Log welfare request</button>
    </div>
  </div>

  <div class="fb-tabs">
    <button class="fb-tab is-active" data-fb-tab="ess">Self-Service Requests</button>
    <button class="fb-tab" data-fb-tab="leave">Leave</button>
    <button class="fb-tab" data-fb-tab="welfare">Staff Welfare</button>
    <button class="fb-tab" data-fb-tab="surveys">Employee Opinion Surveys</button>
  </div>

  <section data-fb-tabpanel="ess">
    <div class="fb-card">
      <div class="fb-card__head"><span class="fb-card__title">Profile updates &amp; life-event notifications</span></div>
      <div id="fb-ess-table"></div>
    </div>
  </section>

  <section data-fb-tabpanel="leave" style="display:none">
    <div class="fb-card">
      <div class="fb-card__head"><span class="fb-card__title">Leave applications</span></div>
      <div id="fb-leave-table"></div>
    </div>
  </section>

  <section data-fb-tabpanel="welfare" style="display:none">
    <div class="fb-card">
      <div class="fb-card__head"><span class="fb-card__title">Staff welfare requests</span></div>
      <div id="fb-welfare-table"></div>
    </div>
  </section>

  <section data-fb-tabpanel="surveys" style="display:none">
    <div class="fb-grid fb-grid--2" id="fb-survey-cards"></div>
  </section>
</div>

<script src="../../assets/js/db.seed.js"></script>
<script src="../../assets/js/events.js"></script>
<script src="../../assets/js/store.js"></script>
<script src="../../assets/js/components.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/shell.js"></script>
<script src="../../assets/js/pages/employee-relations.js"></script>
</body>
</html>
