<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Organizational Structure · Fortunebolt Pharma HR</title>
<link rel="stylesheet" href="../../assets/css/tokens.css" />
<link rel="stylesheet" href="../../assets/css/shell.css" />
</head>
<body>
<script>window.FB_BASE = '../../'; window.FB_PAGE = 'hrbp/org-structure';</script>
<div id="fb-page-root">
  <div class="fb-breadcrumb">HR Business Partnering</div>
  <div class="fb-page-head">
    <div>
      <h1>Organizational Structure</h1>
      <p class="fb-page-desc">Headcount by department, reporting lines, and the full employee directory — the record every other module (recruitment, performance, disciplinary, exit) reads and writes against.</p>
    </div>
  </div>

  <div class="fb-tabs">
    <button class="fb-tab is-active" data-fb-tab="departments">By Department</button>
    <button class="fb-tab" data-fb-tab="directory">Employee Directory</button>
  </div>

  <section data-fb-tabpanel="departments">
    <div class="fb-card">
      <div class="fb-card__head"><span class="fb-card__title">Headcount by department</span></div>
      <div id="fb-dept-chart"></div>
    </div>
    <div class="fb-grid fb-grid--3" id="fb-dept-cards" style="margin-top: var(--fb-sp-5)"></div>
  </section>

  <section data-fb-tabpanel="directory" style="display:none">
    <div class="fb-card">
      <div class="fb-card__head"><span class="fb-card__title">All employees</span><span class="fb-small fb-muted" id="fb-emp-count"></span></div>
      <div id="fb-emp-table"></div>
    </div>
  </section>
</div>

<script src="../../assets/js/db.seed.js"></script>
<script src="../../assets/js/events.js"></script>
<script src="../../assets/js/store.js"></script>
<script src="../../assets/js/components.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/shell.js"></script>
<script src="../../assets/js/pages/org-structure.js"></script>
</body>
</html>
