<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Learning Management (LMS) · Fortunebolt Pharma HR</title>
<link rel="stylesheet" href="../../assets/css/tokens.css" />
<link rel="stylesheet" href="../../assets/css/shell.css" />
</head>
<body>
<script>window.FB_BASE = '../../'; window.FB_PAGE = 'ld/lms';</script>
<div id="fb-page-root">
  <div class="fb-breadcrumb">Learning &amp; Development</div>
  <div class="fb-page-head">
    <div>
      <h1>Learning Management System</h1>
      <p class="fb-page-desc">Course catalog, enrollments synced from Training Needs Analysis, and a gamified leaderboard. Mobile-friendly by design; SCORM/Tin Can-style packages supported as a course format.</p>
    </div>
    <div class="fb-page-actions">
      <button class="fb-btn" id="fb-btn-enroll">+ Enroll employee</button>
      <button class="fb-btn fb-btn--primary" id="fb-btn-new-course">+ New course</button>
    </div>
  </div>

  <div class="fb-tabs">
    <button class="fb-tab is-active" data-fb-tab="catalog">Course Catalog</button>
    <button class="fb-tab" data-fb-tab="enrollments">Enrollments</button>
    <button class="fb-tab" data-fb-tab="leaderboard">Leaderboard</button>
  </div>

  <section data-fb-tabpanel="catalog">
    <div class="fb-grid fb-grid--3" id="fb-course-cards"></div>
  </section>

  <section data-fb-tabpanel="enrollments" style="display:none">
    <div class="fb-card">
      <div class="fb-card__head"><span class="fb-card__title">All enrollments</span></div>
      <div id="fb-enr-table"></div>
    </div>
  </section>

  <section data-fb-tabpanel="leaderboard" style="display:none">
    <div class="fb-card">
      <div class="fb-card__head"><span class="fb-card__title">🏆 Learning leaderboard</span></div>
      <div id="fb-leaderboard"></div>
    </div>
  </section>
</div>

<script src="../../assets/js/db.seed.js"></script>
<script src="../../assets/js/events.js"></script>
<script src="../../assets/js/store.js"></script>
<script src="../../assets/js/components.js"></script>
<script src="../../assets/js/notifications.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/shell.js"></script>
<script src="../../assets/js/pages/lms.js"></script>
</body>
</html>
